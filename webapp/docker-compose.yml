name: sentinel-console

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "1"]
    environment:
      MONGO_INITDB_DATABASE: sentinel
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  api:
    build: ./server
    restart: unless-stopped
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      CORS_ORIGINS: http://localhost:8080
      PUBLIC_URL: http://localhost:8080
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports:
      - "4000:4000"

  worker:
    build: ./server
    restart: unless-stopped
    command: ["node", "src/workers/index.js"]
    env_file: ./server/.env
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/sentinel
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  mongo-data:
  redis-data:
